<!doctype html><html lang="id"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SCHEDULE</title><style>body{margin:0;font:14px Arial;background:#f4f7fb;color:#172033}header{background:#0b2447;color:white;padding:18px 24px;display:flex;justify-content:space-between}h1{margin:0;letter-spacing:2px}.tabs button,button,select,input{padding:9px 13px;border:0;border-radius:7px;margin:3px}.tabs button,button{background:#183b66;color:#fff}main{padding:20px;max-width:1500px;margin:auto}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.card,.box{background:#fff;padding:18px;border-radius:12px;box-shadow:0 2px 10px #0001}.num{font-size:28px;font-weight:bold}.hidden{display:none}.table{overflow:auto;background:#fff;border-radius:12px}table{border-collapse:collapse;width:100%}th,td{padding:9px;border-bottom:1px solid #eee;text-align:center;white-space:nowrap}.P{background:#dff6e7}.M{background:#dcecff}.O{background:#edf0f4}.R{background:#fff0c2}textarea{width:100%;height:280px;padding:12px} @media(max-width:700px){.grid{grid-template-columns:repeat(2,1fr)}header{display:block}}</style><body><header><div><h1>SCHEDULE</h1><small>WIRA SANDI SECURITY</small></div><div class="tabs"><button onclick="tab('dash')">Dashboard</button><button onclick="tab('sched')">Schedule</button><button onclick="tab('wa')">WhatsApp</button><button onclick="tab('people')">Personel</button></div></header><main><section id="dash"><h2>Dashboard</h2><input type="date" id="date" value="2026-08-23" onchange="render()"><select id="unit" onchange="render()"></select><div class="grid"><div class="card">Shift Pagi<div class="num" id="p">0</div></div><div class="card">Shift Malam<div class="num" id="m">0</div></div><div class="card">Reserve<div class="num" id="r">0</div></div><div class="card">Off<div class="num" id="o">0</div></div></div><div class="box" id="duty" style="margin-top:15px"></div></section><section id="sched" class="hidden"><h2>Schedule</h2><select id="su" onchange="table()"></select><div class="table"><table id="tbl"></table></div></section><section id="wa" class="hidden"><h2>WhatsApp Generator</h2><button onclick="copy()">Copy Pesan</button><textarea id="msg"></textarea></section><section id="people" class="hidden"><h2>Personel</h2><div class="table"><table id="pt"></table></div></section></main><script>const D=[['Firman Irawan','Pacific Century Place','2026-08-21','P'],['Firman Irawan','Pacific Century Place','2026-08-22','O'],['Firman Irawan','Pacific Century Place','2026-08-23','O'],['Firman Irawan','Pacific Century Place','2026-08-24','P']];const U=['Semua','Pacific Century Place','CCO Housing','CCO Housing + CPO','South Quarter','ICG Bandung','ICG Surabaya','ICG Medan'];for(const x of U){unit.innerHTML+=`<option>${x}</option>`;su.innerHTML+=`<option>${x}</option>`}function tab(x){document.querySelectorAll('main section').forEach(e=>e.classList.add('hidden'));document.getElementById(x).classList.remove('hidden')}function render(){let a=D.filter(x=>x[2]==date.value&&(unit.value=='Semua'||x[1]==unit.value));for(let [s,id] of [['P','p'],['M','m'],['R','r'],['O','o']])document.getElementById(id).textContent=a.filter(x=>x[3]==s).length;duty.innerHTML='<h3>Personel Bertugas</h3>'+a.filter(x=>x[3]!='O').map(x=>'• '+x[0]+' · '+x[1]+' · '+x[3]).join('<br>');msg.value='📢 *SCHEDULE SECURITY*\n\n📅 '+date.value+'\n📍 '+unit.value+'\n\n'+a.map(x=>'• '+x[0]+' ('+x[3]+')').join('\n')+'\n\n*WIRA SANDI SECURITY*'}function table(){let a=D.filter(x=>su.value=='Semua'||x[1]==su.value);tbl.innerHTML='<tr><th>Nama</th><th>Unit</th><th>Tanggal</th><th>Shift</th></tr>'+a.map(x=>`<tr><td>${x[0]}</td><td>${x[1]}</td><td>${x[2]}</td><td class="${x[3]}">${x[3]}</td></tr>`).join('')}function copy(){msg.select();navigator.clipboard.writeText(msg.value)}function people(){let a=[...new Map(D.map(x=>[x[0]+x[1],x])).values()];pt.innerHTML='<tr><th>No</th><th>Nama</th><th>Unit</th></tr>'+a.map((x,i)=>`<tr><td>${i+1}</td><td>${x[0]}</td><td>${x[1]}</td></tr>`).join('')}render();table();people();</script></body></html>
